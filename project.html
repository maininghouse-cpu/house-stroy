<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проект — HOUSE STROY</title><link rel="stylesheet" href="assets/style.css"><style>
.detail{max-width:1120px;margin:50px auto;padding:0 24px}.detail-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px}.detail-hero img{width:100%;height:390px;object-fit:cover;border-radius:18px;cursor:zoom-in}.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.spec{background:var(--card,#f4f4f4);padding:16px;border-radius:12px}.tabs{display:flex;gap:10px;margin:30px 0 18px;flex-wrap:wrap}.tabs button{padding:12px 20px;border:1px solid #aaa;border-radius:30px;background:transparent;cursor:pointer}.tabs button.active{background:#b82025;color:white}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.gallery img{width:100%;height:220px;object-fit:cover;border-radius:12px;cursor:zoom-in}#lightbox{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:99}#lightbox img{max-width:92vw;max-height:90vh}.back{display:inline-block;margin-bottom:20px}@media(max-width:750px){.detail-hero{grid-template-columns:1fr}.detail-hero img{height:260px}}
</style></head><body><main class="detail"><a class="back" href="projects.html">← Все проекты</a><div id="content">Загрузка проекта…</div></main><div id="lightbox" onclick="this.style.display='none'"><img alt="Увеличенное изображение"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="assets/supabase-config.js"></script><script src="assets/projects.js"></script>
<script>
const params=new URLSearchParams(location.search),root=document.getElementById("content");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function bindZoom(){document.querySelectorAll(".zoom").forEach(i=>i.onclick=()=>{const b=document.getElementById("lightbox");b.querySelector("img").src=i.src;b.style.display="flex";});}
(async()=>{try{const all=await HouseProjects.load(),p=all.find(x=>String(x.id)===params.get("id")||x.slug===params.get("id"));if(!p){root.innerHTML="<h1>Проект не найден</h1>";return;}
root.innerHTML='<div class="detail-hero"><img class="zoom" src="'+esc(p.cover)+'" alt="'+esc(p.name)+'"><div><div class="eyebrow">HOUSE STROY / ПРОЕКТ</div><h1>'+esc(p.name)+'</h1><p>'+esc(p.description)+'</p><h2>'+Number(p.price||0).toLocaleString("ru-RU")+' ₽</h2><div class="specs"><div class="spec"><b>'+p.totalArea+' м²</b><br>Общая площадь</div><div class="spec"><b>'+p.livingArea+' м²</b><br>Жилая площадь</div><div class="spec"><b>'+p.floors+'</b><br>Этажность</div><div class="spec"><b>'+p.bedrooms+'</b><br>Спальни</div></div></div></div><div class="tabs"><button class="active" data-tab="images">Фотографии</button><button data-tab="threeD">3D</button><button data-tab="plans">Планы</button><button data-tab="facades">Фасады</button></div><div class="gallery" id="gallery"></div>';
const draw=key=>{const arr=p[key]||[];document.getElementById("gallery").innerHTML=arr.length?arr.map(src=>'<img class="zoom" src="'+esc(src)+'" alt="Изображение проекта" loading="lazy">').join(""):"<p>В этом разделе пока нет изображений.</p>";bindZoom();};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));b.classList.add("active");draw(b.dataset.tab);});draw("images");bindZoom();
}catch(e){console.error(e);root.innerHTML="<h1>Не удалось загрузить проект</h1><p>Попробуйте обновить страницу.</p>";}})();
</script></body></html>
