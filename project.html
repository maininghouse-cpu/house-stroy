<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проект — HOUSE STROY</title><link rel="stylesheet" href="assets/style.css">
<style>
.detail{max-width:1120px;margin:50px auto;padding:0 24px}
.detail-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px}
.detail-hero>img{width:100%;height:390px;object-fit:cover;border-radius:18px;cursor:zoom-in}
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}
.spec{background:var(--card,#f4f4f4);padding:16px;border-radius:12px}
.tabs{display:flex;gap:10px;margin:30px 0 18px;flex-wrap:wrap}
.tabs button{padding:12px 20px;border:1px solid var(--line,#aaa);border-radius:30px;background:transparent;color:var(--text);cursor:pointer}
.tabs button.active{background:#b82025;color:white;border-color:#b82025}
.gallery-wrap{position:relative}
.gallery{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:2px 2px 16px;scrollbar-width:thin}
.gallery figure{flex:0 0 min(72%,440px);width:min(72%,440px);margin:0;scroll-snap-align:start}
.gallery img{display:block;width:100%;height:290px;object-fit:cover;border-radius:12px;cursor:zoom-in;background:var(--card,#eee)}
.gallery figcaption{padding:9px 3px 0;font-size:12px;color:var(--muted)}
.gallery-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 28px}
.gallery-controls button,.project-nav a{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:30px;padding:11px 17px;cursor:pointer;font:600 13px Inter}
.gallery-controls button:disabled{opacity:.35;cursor:default}
.gallery-count{font-size:12px;color:var(--muted);text-align:center}
.project-nav{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:42px 0 20px}
.project-nav a{display:block;border-radius:14px;padding:18px 20px}
.project-nav a:last-child{text-align:right}
.project-nav small{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}
.project-nav strong{font-size:14px}
#lightbox{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:999;padding:24px}
#lightbox img{max-width:92vw;max-height:84vh;object-fit:contain}
#lightbox button{position:absolute;border:1px solid #ffffff77;background:#111a;color:#fff;border-radius:50%;width:44px;height:44px;font-size:24px;cursor:pointer}
#lightbox .close{top:20px;right:20px}#lightbox .prev{left:20px}#lightbox .next{right:20px}
#lightbox .lightbox-caption{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-size:13px}
.back{display:inline-block;margin-bottom:20px}
@media(max-width:750px){.detail-hero{grid-template-columns:1fr}.detail-hero>img{height:260px}.gallery figure{flex-basis:84%;width:84%}.gallery img{height:230px}.detail{margin:28px auto;padding:0 16px}.project-nav{grid-template-columns:1fr}.gallery-count{font-size:11px}}
</style>
</head>
<body>
<main class="detail">
<a class="back" href="projects.html">← Все проекты</a>
<div id="content">Загрузка проекта…</div>
</main>
<div id="lightbox" aria-label="Просмотр фотографий">
<button class="close" type="button" aria-label="Закрыть">×</button>
<button class="prev" type="button" aria-label="Предыдущее фото">‹</button>
<img alt="Увеличенное изображение">
<button class="next" type="button" aria-label="Следующее фото">›</button>
<div class="lightbox-caption" id="lightboxCaption"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-config.js?v=20261112-5"></script><script src="assets/projects.js?v=20261112-2"></script>
<script>
const params=new URLSearchParams(location.search),root=document.getElementById("content");
let allSlides=[],slideIndex=0,project;
const categoryOrder=["threeD","plans","facades","images"];
const categoryNames={threeD:"3D",plans:"Планы",facades:"Фасады",images:"Фотографии"};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function activeSlideIndex(){
 const g=document.getElementById("gallery");if(!g)return 0;
 const center=g.scrollLeft+g.clientWidth/2;
 let best=0,distance=Infinity;
 [...g.querySelectorAll("figure")].forEach((el,i)=>{const itemCenter=g.scrollLeft+(el.getBoundingClientRect().left-g.getBoundingClientRect().left)+el.offsetWidth/2;const d=Math.abs(itemCenter-center);if(d<distance){distance=d;best=i;}});
 return best;
}
function updateGallery(){
 const g=document.getElementById("gallery");if(!g)return;
 const idx=activeSlideIndex(),slide=allSlides[idx];
 const prev=document.getElementById("galleryPrev"),next=document.getElementById("galleryNext");
 if(prev)prev.disabled=idx<=0;
 if(next)next.disabled=idx>=allSlides.length-1;
 const count=document.getElementById("galleryCount");
 if(count)count.textContent=allSlides.length?(idx+1)+" / "+allSlides.length+" · "+categoryNames[slide.category]:"";
 document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===slide?.category));
}
function goToSlide(index,behavior="smooth"){
 if(!allSlides.length)return;
 slideIndex=Math.max(0,Math.min(index,allSlides.length-1));
 const g=document.getElementById("gallery"),el=g?.querySelectorAll("figure")[slideIndex];
 if(el)g.scrollTo({left:g.scrollLeft+(el.getBoundingClientRect().left-g.getBoundingClientRect().left),behavior});
 updateGallery();
}
function openLightbox(index){
 if(!allSlides.length)return;
 slideIndex=(index+allSlides.length)%allSlides.length;
 const s=allSlides[slideIndex],box=document.getElementById("lightbox");
 box.querySelector("img").src=s.src;
 document.getElementById("lightboxCaption").textContent=categoryNames[s.category]+" · "+(slideIndex+1)+" / "+allSlides.length;
 box.style.display="flex";
}
function changeLightbox(step){openLightbox(slideIndex+step);}
const lightbox=document.getElementById("lightbox");
lightbox.querySelector(".close").onclick=()=>lightbox.style.display="none";
lightbox.querySelector(".prev").onclick=()=>changeLightbox(-1);
lightbox.querySelector(".next").onclick=()=>changeLightbox(1);
lightbox.addEventListener("click",e=>{if(e.target===lightbox)lightbox.style.display="none";});
document.addEventListener("keydown",e=>{if(lightbox.style.display==="flex"){if(e.key==="Escape")lightbox.style.display="none";if(e.key==="ArrowLeft")changeLightbox(-1);if(e.key==="ArrowRight")changeLightbox(1);}});
function renderGallery(){
 allSlides=categoryOrder.flatMap(category=>(project[category]||[]).map((src,i)=>({src,category,index:i})));
 const gallery=document.getElementById("gallery");
 gallery.innerHTML=allSlides.length?allSlides.map((s,i)=>'<figure><img src="'+esc(s.src)+'" alt="'+esc(categoryNames[s.category])+' · '+(i+1)+'" loading="'+(i<2?"eager":"lazy")+'" data-slide="'+i+'"><figcaption>'+categoryNames[s.category]+'</figcaption></figure>').join(""):'<p>В этом проекте пока нет фотографий.</p>';
 gallery.querySelectorAll("img").forEach(img=>img.addEventListener("click",()=>openLightbox(Number(img.dataset.slide))));
 const controls=document.getElementById("galleryControls");controls.style.display=allSlides.length>0?"flex":"none";
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{const idx=allSlides.findIndex(s=>s.category===b.dataset.tab);if(idx>=0)goToSlide(idx);});
 document.getElementById("galleryPrev").onclick=()=>goToSlide(activeSlideIndex()-1);
 document.getElementById("galleryNext").onclick=()=>goToSlide(activeSlideIndex()+1);
 gallery.addEventListener("scroll",updateGallery,{passive:true});
 window.addEventListener("resize",updateGallery);
 if(allSlides.length){const first3d=allSlides.findIndex(s=>s.category==="threeD");goToSlide(first3d>=0?first3d:0,"auto");}
 updateGallery();
}
(async()=>{try{
 const all=await HouseProjects.load();
 const index=all.findIndex(x=>String(x.id)===params.get("id")||x.slug===params.get("id"));
 if(index<0){root.innerHTML="<h1>Проект не найден</h1>";return;}
 project=all[index];
 const prev=all[index-1],next=all[index+1];
 root.innerHTML='<div class="detail-hero"><img id="cover" src="'+esc(project.cover)+'" alt="'+esc(project.name)+'"><div><div class="eyebrow">HOUSE STROY / ПРОЕКТ</div><h1>'+esc(project.name)+'</h1><p>'+esc(project.description)+'</p><h2>'+Number(project.price||0).toLocaleString("ru-RU")+' ₽</h2><div class="specs"><div class="spec"><b>'+project.totalArea+' м²</b><br>Общая площадь</div><div class="spec"><b>'+project.livingArea+' м²</b><br>Жилая площадь</div><div class="spec"><b>'+project.floors+'</b><br>Этажность</div><div class="spec"><b>'+project.bedrooms+'</b><br>Спальни</div></div></div></div>'+
 '<div class="tabs"><button data-tab="threeD">3D</button><button data-tab="plans">Планы</button><button data-tab="facades">Фасады</button><button data-tab="images">Фотографии</button></div>'+
 '<div class="gallery-wrap"><div class="gallery" id="gallery"></div><div class="gallery-controls" id="galleryControls"><button id="galleryPrev" type="button" aria-label="Предыдущее изображение">← Назад</button><span class="gallery-count" id="galleryCount"></span><button id="galleryNext" type="button" aria-label="Следующее изображение">Вперёд →</button></div></div>'+
 '<nav class="project-nav" aria-label="Навигация по проектам">'+(prev?'<a href="project.html?id='+encodeURIComponent(prev.id)+'"><small>← Предыдущий проект</small><strong>'+esc(prev.name)+'</strong></a>':'<span></span>')+(next?'<a href="project.html?id='+encodeURIComponent(next.id)+'"><small>Следующий проект →</small><strong>'+esc(next.name)+'</strong></a>':'<span></span>')+'</nav>';
 document.getElementById("cover").onclick=()=>{if(project.cover){const old=allSlides;allSlides=[{src:project.cover,category:"cover"}];openLightbox(0);allSlides=old;}};
 renderGallery();
 }catch(e){console.error(e);root.innerHTML="<h1>Не удалось загрузить проект</h1><p>Попробуйте обновить страницу.</p>";}})();
</script>
</body></html>
